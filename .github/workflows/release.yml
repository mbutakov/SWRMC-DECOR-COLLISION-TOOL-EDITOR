name: Build SWRMC

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            archive: zip
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir SWRMC
          cp target/${{ matrix.target }}/release/swrmc SWRMC/
          tar -czf SWRMC-${{ matrix.target }}.tar.gz SWRMC
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory SWRMC
          Copy-Item target/${{ matrix.target }}/release/swrmc.exe SWRMC/
          Compress-Archive -Path SWRMC -DestinationPath SWRMC-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SWRMC-${{ matrix.target }}
          path: SWRMC-${{ matrix.target }}.${{ matrix.archive }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SWRMC-${{ matrix.target }}.${{ matrix.archive }}
